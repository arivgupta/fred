<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141216" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="G — the AI secretary for busy parents. Delegate reminders, calls, and scheduling by chat, text, or voice."
    />
    <title>G — Your family’s AI secretary</title>

    <!-- Apply stored theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('g_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>

    <!-- Typefaces (graceful fallbacks are defined in tokens.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <!-- Google Identity Services (OAuth sign-in) -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
